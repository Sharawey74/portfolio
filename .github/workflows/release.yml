name: Release

# The owner pushes a tag `vX.Y.Z` on the merge commit (DEPLOY.md → Release).
# This job turns that version's CHANGELOG.md section into a GitHub Release,
# and fails if the section is missing or package.json disagrees.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check package.json matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but package.json is $pkg"
            exit 1
          fi

      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
