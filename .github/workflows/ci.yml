name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, facts, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Schemas (source + asOf), banned claims, semantic asserts.
      # Private do-not-publish terms are checked locally only (git-ignored list).
      - name: Facts check
        run: npm run check:facts

      - name: Contrast check
        run: npm run check:contrast

      - name: Build
        run: npm run build

      # After the build so the compiled CSS is scanned too.
      - name: One-color check
        run: npm run check:colors

      - name: First-load JS budget
        run: npm run report:bundle
